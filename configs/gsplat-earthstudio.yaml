# Preset: 3DGS on gsplat for Earth Studio renders (ROADMAP 2.2, docs/BASELINE.md).
# Training keys only, so it composes with a site run:
#   tools\gsplat_env.bat venv\Scripts\aerosplat run --site default/dataset_v6 --from train ^
#       --config configs/gsplat-earthstudio.yaml
# dataset_v6, 2-3 seeds: 27.00 dB / SSIM 0.900 vs 26.47 / 0.891 with the Inria rasterizer.
rasterizer: gsplat
densify_strategy: mcmc        # the gain (+0.56 dB): fixed 2M budget, relocation of dead splats
rasterize_mode: antialiased   # SSIM +0.004; matches the viewer's Mip-Splatting compensation
# Earth Studio renders a textured mesh: no view-dependent colour to learn. SH3 measured
# the same PSNR at ~2x the training time and ~3.7x the .pt size, so keep SH off here.
sh_degree: 0
iterations: 5500
max_gaussians: 2000000
# Depth regularisation from the run's own COLMAP MVS depth maps (owner's decision 2026-10-19):
# dataset_v6, 7000 its, 2 seeds: depth error on test frames -20 % (0.149 -> 0.119 % vs MVS,
# 0.146 -> 0.114 % vs SfM points), PSNR unchanged (-0.04 dB, noise), +10 % training time.
# Geometry feeds semantics, occupancy and missions, so it is worth the time here.
depth_reg: mvs
depth_weight: 1.0
depth_weight_final: 0.01
