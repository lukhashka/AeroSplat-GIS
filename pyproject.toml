[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosplat"
version = "0.6.1"
description = "UAV 3D reconstruction (COLMAP + 3D Gaussian Splatting) with GIS georeferencing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    # ndimage and distance transforms: aerosplat.semantics (terrain, buildings, facades, pads),
    # aerosplat.surface (occupancy, carving, esdf), mission.takeoff, export.dem.
    "scipy>=1.11",
    "pillow>=10",
    "piexif==1.1.3",
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pyproj>=3.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# torch must match your CUDA build — see requirements.txt / README for the index URL.
train = ["torch>=2.2", "torchvision>=0.17"]
# Optional training log (`tensorboard: true` / `--tensorboard DIR`, gsplat only).
tensorboard = ["tensorboard>=2.14"]
# `ruff check .` and `mypy src` are CI gates, so a new release of either must not turn the build
# red on unchanged code — that is how three type errors became 67 between 2026-10-15 and
# 2026-10-21. These two are pinned exactly, to the versions CI proved green. numpy is pinned here
# rather than in the runtime dependency because its stubs decide what `mypy src` reports; a normal
# install keeps the wider range above. Raise any of them deliberately, in a commit that also fixes
# whatever the new version flags.
dev = ["pytest", "httpx", "ruff==0.17.1", "mypy==2.4.0", "numpy>=2.4,<2.5"]
# ArduPilot SITL harness (aerosplat.sim, `pytest -m sitl`); SITL itself runs in WSL2 / Linux.
sim = ["pymavlink==2.4.50"]
# GIS export (aerosplat.export, `aerosplat export`): GeoTIFF/COG and LAS/LAZ.
gis = ["rasterio>=1.3", "laspy>=2.4", "lazrs>=0.5"]
# Visual positioning (aerosplat.vps): ORB / AKAZE / PnP. OpenCV 5 moved AKAZE to contrib.
vps = ["opencv-python-headless>=4.8,<5"]

[project.scripts]
aerosplat = "aerosplat.starter:cli"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["aerosplat", "aerosplat.pipeline", "aerosplat.io", "aerosplat.geo",
            "aerosplat.sfm", "aerosplat.gs", "aerosplat.server", "aerosplat.store",
            "aerosplat.store.migrations", "aerosplat.store.migrations.versions",
            "aerosplat.ingest", "aerosplat.jobs", "aerosplat.render", "aerosplat.semantics",
            "aerosplat.taxonomy", "aerosplat.authored", "aerosplat.surface", "aerosplat.mission",
            "aerosplat.sim", "aerosplat.export", "aerosplat.auth", "aerosplat.vps"]

[tool.setuptools.package-data]
"aerosplat.store.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sitl: flies ArduCopter SITL (opt-in: pytest -m sitl; docs/SIMULATION_AND_DELIVERY.md §4.8)",
    "hazard(*ids): hazards from docs/HAZARDS.md this test covers, e.g. hazard('H-004')",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "diff-gaussian-rasterization", "venv", "data"]

[tool.ruff.lint]
# Start narrow (real errors only); widen gradually as legacy modules are cleaned up.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["legacy/", "venv/", "diff-gaussian-rasterization/", "data/", "tools/", "tests/"]
