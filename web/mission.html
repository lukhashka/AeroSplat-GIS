<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroSplat-GIS: місія над сценою</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050505; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        /* The page around this frame (web/app, "Місія / проліт") carries the UI. */
        #ui-panel, #mode-selector-wrapper { display: none !important; }
    </style>
    <script>
        // Read by appGLSL.js before it loads anything: ?noscene=1 draws the mission alone.
        window.AEROSPLAT_NO_SCENE = new URLSearchParams(location.search).get('noscene') === '1';
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="appGLSL.js"></script>
    <script src="mission-overlay.js"></script>
</body>
</html>
